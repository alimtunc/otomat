name: Preview base image

# scripts/preview/host/Dockerfile FROMs this image so a pull-request provision never runs
# apt-get. It only rebuilds when the base Dockerfile changes; run it once by hand
# (workflow_dispatch) when enabling web previews — docs/release/web-preview.md.
on:
  push:
    branches: [main]
    paths: [scripts/preview/host/base.Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 explicitly: Cloudflare Containers only run amd64 images, whatever the runner.
      - name: Build and push the base image
        run: |
          docker build --platform linux/amd64 \
            -f scripts/preview/host/base.Dockerfile \
            -t "ghcr.io/${{ github.repository }}/preview-base:node22" \
            scripts/preview/host
          docker push "ghcr.io/${{ github.repository }}/preview-base:node22"

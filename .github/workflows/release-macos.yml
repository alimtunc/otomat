name: Release macOS alpha

# Tagging `v<version>` builds, signs, notarizes, staples, verifies and publishes the prerelease.
# Running it manually does everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple Silicon only, and never cross-compiled: the app ships the build host's better-sqlite3
    # binary, so an architecture is releasable only from a runner of that architecture.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are the commit subjects since the previous tag.
          fetch-depth: 0

      - name: Install pnpm
        # Pinned to a commit, unlike in ci.yml: this job handles signing credentials, so a
        # third-party action must not be reachable through a mutable tag.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}

      # Runs before any Apple credential exists on this runner, so the test suite never shares a
      # filesystem or an environment with the signing key.
      - name: Check
        run: pnpm check

      - name: Materialize the App Store Connect key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "::error::Missing repository secret APPLE_API_KEY_P8_BASE64 (base64 of the App Store Connect .p8 key). See docs/release/macos-alpha.md."
            exit 1
          fi
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      # Every credential present, an architecture this runner can build, and a tag that agrees with
      # the packaged version — before anything expensive.
      - name: Preflight the release inputs
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:preflight

      - name: Build the signed release
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:release

      - name: Smoke the packaged artifact
        run: pnpm desktop:smoke

      - name: Upload the build outputs
        uses: actions/upload-artifact@v7
        with:
          name: otomat-macos-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/manifest.json
            apps/desktop/release/release-notes.md
          if-no-files-found: error

      # Only a tag push publishes; a manual dispatch exercises the pipeline without creating one,
      # even when it is dispatched against a tag ref.
      # A prerelease version publishes a GitHub prerelease, which is the flag electron-updater reads
      # to keep the stable and prerelease feeds apart.
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          flags="--verify-tag"
          case "$version" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "Otomat $GITHUB_REF_NAME — macOS alpha" \
            --notes-file apps/desktop/release/release-notes.md \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/latest-mac.yml \
            apps/desktop/release/manifest.json

      - name: Shred the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

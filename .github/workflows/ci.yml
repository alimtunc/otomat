name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # React Doctor's changed scope and the baseline anti-ratchet both diff against main,
      # which the default pull-request checkout does not fetch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provide the diff base
        run: |
          git show-ref --verify --quiet refs/heads/main ||
            git fetch --no-tags origin +refs/heads/main:refs/heads/main

      - uses: ./.github/actions/setup-workspace

      - name: Static gates
        run: pnpm check:static

      - name: Baseline anti-ratchet
        run: node scripts/baseline-anti-ratchet.mjs main

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build, boundaries, typecheck and dist smoke
        run: pnpm check:build

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build web test dependencies
        run: pnpm --filter "@otomat/web..." run build

      - name: Test web
        run: pnpm --filter @otomat/web test

  test-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build daemon test dependencies
        run: pnpm --filter "@otomat/local-daemon..." run build

      - name: Test daemon
        run: pnpm --filter @otomat/local-daemon test

  test-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build package test dependencies
        run: pnpm --filter "./packages/**" --filter "@otomat/desktop..." run build

      - name: Test desktop and packages
        run: pnpm test:packages

  check:
    if: always()
    needs: [static, build, test-web, test-daemon, test-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          DAEMON_RESULT: ${{ needs.test-daemon.result }}
          PACKAGES_RESULT: ${{ needs.test-packages.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$WEB_RESULT" = success
          test "$DAEMON_RESULT" = success
          test "$PACKAGES_RESULT" = success

  daemon-bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Deploy the self-contained daemon
        run: |
          pnpm --filter "@otomat/local-daemon..." run build
          pnpm --filter @otomat/local-daemon deploy --prod --legacy "$RUNNER_TEMP/daemon"

      # Not what smoke:dist covers: imports must resolve inside the deployed tree, and its
      # /api/health build must name this commit.
      - name: Smoke the deployed daemon
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/daemon-smoke"
          mkdir -p "$data"
          OTOMAT_DAEMON_PORT=43190 OTOMAT_DB_PATH="$data/smoke.db" OTOMAT_PROJECT_ROOT="$data" \
            node "$RUNNER_TEMP/daemon/dist/index.js" > "$data/daemon.log" 2>&1 &
          daemon_pid=$!
          health=""
          for _ in $(seq 1 40); do
            if health=$(curl -fsS "http://127.0.0.1:43190/api/health" 2>/dev/null); then break; fi
            sleep 0.5
          done
          kill "$daemon_pid" 2>/dev/null || true
          if [ -z "$health" ]; then
            echo "deployed daemon never served /api/health"
            cat "$data/daemon.log"
            exit 1
          fi
          echo "$health"
          test "$(echo "$health" | jq -r .build)" = "${HEAD_SHA:0:7}"

      - name: Name and pack the bundle
        id: bundle
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          name="otomat-daemon-${HEAD_SHA:0:7}-linux-x64"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${name}.tar.gz" daemon

      # The public artifact name makes remote hosts install immediately, so only the post-check
      # publish job may expose it. This full-SHA candidate is an internal one-day handoff.
      # Re-runs share the run's artifact namespace; without overwrite a rerun's upload 409s.
      - name: Upload the bundle candidate
        uses: actions/upload-artifact@v7
        with:
          name: otomat-daemon-candidate-${{ github.sha }}-linux-x64
          path: ${{ runner.temp }}/otomat-daemon-*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-daemon:
    if: github.event_name == 'push'
    needs: [check, daemon-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download the checked bundle candidate
        uses: actions/download-artifact@v8
        with:
          name: otomat-daemon-candidate-${{ github.sha }}-linux-x64
          path: ${{ runner.temp }}

      - name: Publish the daemon bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.daemon-bundle.outputs.name }}
          path: ${{ runner.temp }}/otomat-daemon-*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  package-macos:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}

      - name: Package the unsigned desktop artifact
        env:
          OTOMAT_CHANNEL: local
        run: pnpm desktop:package

      - name: Smoke the packaged artifact
        env:
          OTOMAT_CHANNEL: local
        run: pnpm desktop:smoke

      - name: Smoke the local channel across two commits
        run: pnpm desktop:smoke:local

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gate as `pnpm check` locally, kept as one step so CI can never drift from it.
      - name: Check
        run: pnpm check

      # Needs a base ref, so it lives in CI rather than `pnpm check`.
      - name: Baseline anti-ratchet
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/baseline-anti-ratchet.mjs origin/main

  # The unsigned artifact is the substrate the signed release is built from, and only a macOS host
  # can produce it. Pushes to main keep it as a packaging-regression gate; pull requests also upload
  # the DMG as an internal preview — ad-hoc signed, never notarized, never a release
  # (docs/release/macos-alpha.md). The job reads no secret, so a fork PR builds safely with the
  # read-only token the pull_request event already grants.
  package-macos:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request the default checkout is the synthetic merge commit; build the PR head
          # instead so the embedded build-info.json names the exact commit the preview came from.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package the unsigned desktop artifact
        run: pnpm desktop:package

      - name: Smoke the packaged artifact
        run: pnpm desktop:smoke

      - name: Name the preview artifact
        id: preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "name=otomat-pr-${PR_NUMBER}-macos-arm64-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Short retention: previews exist to test a PR, not to archive builds.
      - name: Upload the preview DMG
        id: upload
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preview.outputs.name }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Describe the preview in the run summary
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_NAME: ${{ steps.preview.outputs.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/docs/release/macos-alpha.md#pr-preview-builds
        run: |
          {
            echo "## macOS preview — PR #${PR_NUMBER}"
            echo ""
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Download: [${ARTIFACT_NAME}](${ARTIFACT_URL}) — kept 7 days"
            echo ""
            echo "> **Internal preview.** Ad-hoc signed — neither Developer ID signed nor notarized —"
            echo "> and not distributable. Install steps for a test Mac: [PR preview builds](${DOC_URL})."
          } >> "$GITHUB_STEP_SUMMARY"

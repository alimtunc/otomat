name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gate as `pnpm check` locally, kept as one step so CI can never drift from it.
      - name: Check
        run: pnpm check

      # Needs a base ref, so it lives in CI rather than `pnpm check`.
      - name: Baseline anti-ratchet
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/baseline-anti-ratchet.mjs origin/main

  # The exact self-contained deploy the remote execution host runs
  # (docs/ai/remote-execution-host.md), published as a plain artifact so updating a host is a
  # download instead of a build on the host. An artifact is only a file: nothing anywhere starts a
  # daemon from it.
  daemon-bundle:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy the self-contained daemon
        run: |
          pnpm --filter "@otomat/local-daemon..." run build
          pnpm --filter @otomat/local-daemon deploy --prod --legacy "$RUNNER_TEMP/daemon"

      # Boots the deploy itself (not the workspace dist smoke:dist already covers): its imports
      # must resolve inside the deployed tree, and its /api/health build must name this commit.
      - name: Smoke the deployed daemon
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/daemon-smoke"
          mkdir -p "$data"
          OTOMAT_DAEMON_PORT=43190 OTOMAT_DB_PATH="$data/smoke.db" OTOMAT_PROJECT_ROOT="$data" \
            node "$RUNNER_TEMP/daemon/dist/index.js" > "$data/daemon.log" 2>&1 &
          daemon_pid=$!
          health=""
          for _ in $(seq 1 40); do
            if health=$(curl -fsS "http://127.0.0.1:43190/api/health" 2>/dev/null); then break; fi
            sleep 0.5
          done
          kill "$daemon_pid" 2>/dev/null || true
          if [ -z "$health" ]; then
            echo "deployed daemon never served /api/health"
            cat "$data/daemon.log"
            exit 1
          fi
          echo "$health"
          test "$(echo "$health" | jq -r .build)" = "${HEAD_SHA:0:7}"

      - name: Name and pack the bundle
        id: bundle
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          name="otomat-daemon-${HEAD_SHA:0:7}-linux-x64"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${name}.tar.gz" daemon

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ runner.temp }}/otomat-daemon-*.tar.gz
          if-no-files-found: error
          # Re-runs share the run's artifact namespace; without this a green run re-run for a flaky
          # test fails its upload with a 409 on the identically named artifact.
          overwrite: true
          retention-days: 7

  # The unsigned artifact is the substrate the signed release is built from, and only a macOS host
  # can produce it; on main it is the packaging-regression gate (docs/release/macos-alpha.md).
  package-macos:
    needs: check
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `local` channel's data roots are the same across commits; `stable` is unreachable here —
      # only `pnpm desktop:release` passes that channel.
      - name: Package the unsigned desktop artifact
        env:
          OTOMAT_CHANNEL: local
        run: pnpm desktop:package

      - name: Smoke the packaged artifact
        env:
          OTOMAT_CHANNEL: local
        run: pnpm desktop:smoke

      # Packages the merge commit a second time and launches both builds: the promise that a local
      # package keeps its profile across commits is only worth what an actual second build shows.
      - name: Smoke the local channel across two commits
        run: pnpm desktop:smoke:local

name: Web preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect resources or tear down one pull request
        required: true
        type: choice
        options: [inventory, teardown]
      pull_request:
        description: Pull request number required for teardown
        required: false
        type: string
      pages_project:
        description: Optional Pages project override for recovery
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: web-preview-${{ github.event.pull_request.number || inputs.pull_request || 'inventory' }}
  # A superseded commit's run is safe to cancel: provision is idempotent and the manifest refuses
  # a mismatched daemon. A close event and a dispatched cleanup must run to completion instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  deploy:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      # The head commit, not the merge ref: the daemon build stamp and the manifest name the
      # head sha — on the merge ref they would never match.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-workspace

      # One filtered build: web and daemon share @otomat/domain and the other workspace packages,
      # so building them in one pnpm invocation builds each shared package once.
      - name: Build this commit's preview payloads
        env:
          PREVIEW_DAEMON_ENABLED: ${{ vars.PREVIEW_DAEMON_ENABLED }}
        run: |
          if [ -n "$PREVIEW_DAEMON_ENABLED" ]; then
            pnpm --filter "@otomat/web..." --filter "@otomat/local-daemon..." run build
            pnpm --filter @otomat/local-daemon deploy --prod --legacy "$RUNNER_TEMP/daemon"
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/daemon.tar.gz" daemon
          else
            pnpm --filter "@otomat/web..." run build
          fi

      - name: Stamp the deployment manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"pull_request":%s,"build":"%s"}\n' "$PR_NUMBER" "${HEAD_SHA:0:7}" \
            > apps/web/dist/preview.json

      - name: Publish the preview to Cloudflare Pages
        id: pages
        if: vars.CLOUDFLARE_PAGES_PROJECT != ''
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$HEAD_SHA" \
            --commit-dirty=true
          echo "url=https://pr-$PR_NUMBER.$PAGES_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      # The host Dockerfile FROMs the prebuilt ghcr base (preview-base.yml), which the wrangler
      # build pulls with this login.
      - name: Log in to the GitHub container registry
        if: vars.PREVIEW_DAEMON_ENABLED != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Isolated per pull request and per commit: its own Worker, its own container image built from
      # this commit's daemon bundle, its own ephemeral database and fixture repository. No daemon
      # port exists anywhere — the container only answers its Worker, and the Worker only answers
      # the façade's client pair.
      - name: Deploy this commit's daemon worker
        if: vars.PREVIEW_DAEMON_ENABLED != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_CLIENT_ID: ${{ secrets.PREVIEW_CLIENT_ID }}
          PREVIEW_CLIENT_SECRET: ${{ secrets.PREVIEW_CLIENT_SECRET }}
        run: |
          node scripts/preview/instance.mjs provision \
            --pr "$PR_NUMBER" \
            --build "${HEAD_SHA:0:7}" \
            --bundle "$RUNNER_TEMP/daemon.tar.gz"

      # Boots the container before the first reviewer clicks. continue-on-error: a daemon that
      # never answers marks this step failed as a visible signal, but the preview URL itself still
      # works on fixtures, so the pipeline stays green.
      - name: Warm this commit's daemon container
        if: vars.PREVIEW_DAEMON_ENABLED != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_CLIENT_ID: ${{ secrets.PREVIEW_CLIENT_ID }}
          PREVIEW_CLIENT_SECRET: ${{ secrets.PREVIEW_CLIENT_SECRET }}
        run: node scripts/preview/instance.mjs warm --pr "$PR_NUMBER"

  announce:
    if: ${{ !cancelled() && needs.deploy.outputs.url != '' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Publish the preview URL on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ needs.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Web preview for \x60%s\x60: %s\n\nIt opens on browser fixtures straight away, and switches to this commit'"'"'s own isolated daemon once its container answers. Sign in with Cloudflare Access; no DMG needed.' "${HEAD_SHA:0:7}" "$URL")
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" --edit-last --create-if-none

  # Close or merge and the pull request keeps nothing: teardown deletes its exact worker,
  # container application, Pages deployments and registry images; other previews are untouched.
  # The shared setup without its install: the teardown path of instance.mjs runs without an
  # installed workspace, and `pnpm dlx` fetches wrangler on demand.
  teardown:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'teardown') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Delete this pull request's dedicated resources
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.pages_project || vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare preview cleanup skipped because this repository has no credentials"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare preview cleanup has partial credentials"
            exit 1
          fi
          node scripts/preview/instance.mjs teardown --pr "$PR_NUMBER"

  inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Inventory dedicated resources and PR state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.pages_project || vars.CLOUDFLARE_PAGES_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf '```json\n'
            node scripts/preview/instance.mjs inventory
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

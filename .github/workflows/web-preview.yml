name: Web preview

# A pull request gets a protected Cloudflare URL instead of a DMG: the UI deploys immediately and
# runs on browser fixtures, and the same URL drives this commit's own VPS daemon once its instance
# is provisioned. The one-time Cloudflare and VPS setup lives in docs/release/web-preview.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the cockpit and the daemon this commit ships
        run: |
          pnpm --filter "@otomat/web..." run build
          pnpm --filter "@otomat/local-daemon..." run build
          pnpm --filter @otomat/local-daemon deploy --prod --legacy "$RUNNER_TEMP/daemon"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/daemon.tar.gz" daemon

      # The one runtime configuration the preview needs: which pull request this deployment serves
      # and the commit it was built from. The cockpit reads it at boot, the façade reads it to find
      # this pull request's tunnel, and a daemon on any other commit is refused against it.
      - name: Stamp the deployment manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"pull_request":%s,"build":"%s"}\n' "$PR_NUMBER" "${HEAD_SHA:0:7}" \
            > apps/web/dist/preview.json

      - name: Publish the preview to Cloudflare Pages
        id: pages
        if: vars.CLOUDFLARE_PAGES_PROJECT != ''
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-dirty=true
          echo "url=https://pr-$PR_NUMBER.$PAGES_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Upload the daemon bundle for the instance step
        if: vars.CLOUDFLARE_PAGES_PROJECT != ''
        uses: actions/upload-artifact@v7
        with:
          name: otomat-preview-daemon-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/daemon.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Isolated per commit exactly like the desktop preview instances: its own directory, database,
  # fixture repository, worktrees, loopback port and tunnel hostname. Nothing is exposed publicly —
  # cloudflared connects outbound, and Access guards the hostname.
  instance:
    if: github.event.action != 'closed' && vars.PREVIEW_VPS_HOST != '' && vars.PREVIEW_DAEMON_HOSTNAME != ''
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the domain package the provisioner reads its conventions from
        run: pnpm --filter @otomat/domain run build

      - uses: actions/download-artifact@v7
        with:
          name: otomat-preview-daemon-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}

      - name: Authorize the runner against the preview host
        env:
          SSH_KEY: ${{ secrets.PREVIEW_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Provision this commit's instance
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VPS_HOST: ${{ vars.PREVIEW_VPS_HOST }}
          DAEMON_HOSTNAME: ${{ vars.PREVIEW_DAEMON_HOSTNAME }}
        run: |
          node scripts/preview/instance.mjs provision \
            --host "$VPS_HOST" \
            --pr "$PR_NUMBER" \
            --build "${HEAD_SHA:0:7}" \
            --hostname "$DAEMON_HOSTNAME" \
            --bundle "$RUNNER_TEMP/daemon.tar.gz"

  # Runs whether or not the instance step was configured: the sandbox URL is already testable.
  announce:
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.deploy.outputs.url != '' }}
    needs: [deploy, instance]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the preview URL on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ needs.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Web preview for \x60%s\x60: %s\n\nIt opens on browser fixtures straight away, and switches to this commit'"'"'s own VPS daemon once its instance answers. Sign in with Cloudflare Access; no DMG needed.' "${HEAD_SHA:0:7}" "$URL")
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" --edit-last --create-if-none

  # Close or merge and the pull request keeps nothing: every instance it still holds is stopped, its
  # data removed and its tunnel route re-derived without it. Other previews are untouched.
  teardown:
    if: github.event.action == 'closed' && vars.PREVIEW_VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the domain package the provisioner reads its conventions from
        run: pnpm --filter @otomat/domain run build

      - name: Authorize the runner against the preview host
        env:
          SSH_KEY: ${{ secrets.PREVIEW_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Stop every instance this pull request still holds
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VPS_HOST: ${{ vars.PREVIEW_VPS_HOST }}
        run: |
          node scripts/preview/instance.mjs teardown \
            --host "$VPS_HOST" \
            --pr "$PR_NUMBER"

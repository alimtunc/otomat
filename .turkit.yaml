# Generated by /turkit-init — detected pnpm, base main, Linear MCP present (needs auth) + OTO-N branch pattern
commands:
  dev: pnpm dev
  check: pnpm check
  lint: pnpm lint
  fmt: pnpm format
  test: pnpm test
  build: pnpm build
base_branch: main
rules:
  docs:
    - AGENTS.md
workflow:
  token_budget: normal
review:
  strictness: strict
  # allow-why-only mirrors AGENTS.md: a one-line non-obvious *why* is legal, everything else is P0.
  comments: allow-why-only
output:
  style: compact
  language: auto
  technical_terms: keep-english
